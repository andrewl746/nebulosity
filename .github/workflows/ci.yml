# CI: the gate and the package on Linux, macOS and Windows (S9, ADR-058). Each system runs tsc, lint and the suite,
# then builds the Map the way the package ships it (npm run build:package, so prepack's check passes), packs, installs
# the tarball into a scratch prefix and uses the installed copy: --version, doctor, two fixtures indexed, an MCP session
# through the installed launcher (scripts/mcp-smoke.mjs, which turns live events off), and the Map on port 3123 with its
# worker off. Everything the installed copy writes goes to a scratch data folder (NEBULOSITY_DATA).
#
# How it runs: never by itself, on pull requests or on the working branches. The repo is private and macOS minutes count
# ten times, so each run is asked for. GitHub offers "Run workflow" only for a workflow on the default branch, and main
# changes only at slice boundaries, so until this file is on main a run starts when the commit to test is pushed to a
# ci/ branch:
#   git push origin <commit>:refs/heads/ci/<name>      (add --force when that ci/ branch holds an earlier commit)
#   gh run list --branch ci/<name>
#   gh run watch <run id> --exit-status
# Once the file is on main, a run can also start by hand: gh workflow run ci.yml --ref <branch>.
#
# Every step after npm ci runs even when an earlier one failed (each package step waits only for the step it needs), so
# one run shows every failure on every system.
name: ci
on:
  workflow_dispatch:
  push:
    branches: ["ci/**"]
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: npm ci
        id: deps
        run: npm ci
      - name: tsc
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npx tsc --noEmit
      - name: lint
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run lint
      - name: tests
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npx vitest run
      - name: Build the Map as the package ships it
        id: build
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run build:package
      - name: Pack, and install the tarball into a scratch prefix
        id: install
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          # one spelling that both bash and node read: D:/a/_temp on Windows
          if [ "$RUNNER_OS" = "Windows" ]; then SCRATCH=$(cygpath -m "$RUNNER_TEMP"); else SCRATCH="$RUNNER_TEMP"; fi
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p "$SCRATCH/pack"
          npm pack --pack-destination "$SCRATCH/pack"
          npm install -g --prefix "$SCRATCH/prefix" "$SCRATCH/pack/nebulosity-$VERSION.tgz"
          # npm's global layout: the command and node_modules in the prefix on Windows, bin/ and lib/node_modules/ elsewhere
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="$SCRATCH/prefix"; PKG="$SCRATCH/prefix/node_modules/nebulosity"
          else BIN="$SCRATCH/prefix/bin"; PKG="$SCRATCH/prefix/lib/node_modules/nebulosity"; fi
          { echo "SCRATCH=$SCRATCH"; echo "BIN=$BIN"; echo "PKG=$PKG"; echo "VERSION=$VERSION"; } >> "$GITHUB_ENV"
      - name: nebulosity --version and doctor
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          export NEBULOSITY_DATA="$SCRATCH/nebulosity-data"
          shown=$("$BIN/nebulosity" --version)
          echo "$shown"
          test "$shown" = "$VERSION"
          "$BIN/nebulosity" doctor
      - name: nebulosity index, both fixtures
        id: index
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          export NEBULOSITY_DATA="$SCRATCH/nebulosity-data"
          "$BIN/nebulosity" index test/fixtures/mini-repo --no-activate
          "$BIN/nebulosity" index test/fixtures/arch-repo
      - name: An MCP session through the installed launcher
        if: ${{ !cancelled() && steps.index.outcome == 'success' }}
        run: |
          export NEBULOSITY_DATA="$SCRATCH/nebulosity-data"
          # the file counts are the fixtures' ground truth: arch-repo's 21 source files (V1.6 plan), mini-repo's 8 (V1.1 plan)
          node scripts/mcp-smoke.mjs --launcher "$PKG/mcp/launch.mjs" --repo test/fixtures/arch-repo --files 21
          node scripts/mcp-smoke.mjs --launcher "$PKG/mcp/launch.mjs" --repo test/fixtures/mini-repo --files 8
      - name: The Map on port 3123
        if: ${{ !cancelled() && steps.index.outcome == 'success' }}
        run: |
          NEBULOSITY_WORKER=off NEBULOSITY_DATA="$SCRATCH/nebulosity-data" "$BIN/nebulosity" map --port 3123 > "$SCRATCH/map.log" 2>&1 &
          MAP=$!
          up=""
          for i in $(seq 1 120); do
            if curl -sf http://127.0.0.1:3123/api/status > /dev/null; then up=yes; break; fi
            kill -0 "$MAP" 2> /dev/null || break   # the command ended: nothing to wait for
            sleep 1
          done
          failed=""
          if [ -n "$up" ]; then
            # arch-repo is the active repo (indexed last, without --no-activate), its structure ready: its 21 source files
            status=$(curl -sf http://127.0.0.1:3123/api/status) || failed=yes
            echo "$status"
            case "$status" in
              *'test/fixtures/arch-repo","stages":{"structure":{"state":"ready","done":21,"total":21}'*) ;;
              *) echo "the status doesn't show arch-repo's 21 files ready"; failed=yes ;;
            esac
            curl -sf -o /dev/null http://127.0.0.1:3123/ || { echo "the page didn't load"; failed=yes; }
          else
            echo "the Map didn't answer /api/status"; failed=yes
          fi
          # stop the command and the next start it spawned
          if [ "$RUNNER_OS" = "Windows" ]; then
            taskkill //F //T //PID "$(cat "/proc/$MAP/winpid" 2> /dev/null)" > /dev/null 2>&1 || true
            powershell -NoProfile -Command "Get-NetTCPConnection -LocalPort 3123 -State Listen -ErrorAction SilentlyContinue | ForEach-Object { Stop-Process -Id \$_.OwningProcess -Force }" || true
          else
            pkill -P "$MAP" || true
            kill "$MAP" 2> /dev/null || true
          fi
          echo "--- the Map's output"
          cat "$SCRATCH/map.log"
          test -z "$failed"
