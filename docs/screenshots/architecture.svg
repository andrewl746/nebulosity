<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
<!--
  The README's architecture diagram, drawn in the Map's own language (app/globals.css): its dot-grid canvas, its boxes,
  its square import lines, and its colors, each meaning what it means on the Map. Orange is Claude Code at work, green is
  indexing, purple is the selected box (the index) and its direct links.
  architecture.png is this file at 2x: a headless Edge or Chrome screenshot at 800 by 800 with a device scale factor of 2,
  allowed to read local files so that the IBM Plex fonts in site/fonts load.
-->
<title>How Nebulosity fits together</title>
<desc>nebulosity index reads your repo into the index, a SQLite database on your machine, and the Map keeps it current on every save. The MCP server and the Map both read the index. Claude Code asks the MCP server and gets its answer, often in one call, and each tool call shows up on the Map, which you look at in a browser or VS Code. The only thing that leaves your machine is the optional AI summaries, written by the Anthropic API with your key.</desc>
<style>
  @font-face { font-family: "IBM Plex Sans"; src: url("../../site/fonts/ibm-plex-sans-latin.woff2") format("woff2"); font-weight: 100 700; }
  @font-face { font-family: "IBM Plex Mono"; src: url("../../site/fonts/ibm-plex-mono-400-latin.woff2") format("woff2"); font-weight: 400; }
  text { font-family: "IBM Plex Sans", system-ui, sans-serif; }
  .name { font-size: 16px; font-weight: 600; fill: #F1EEF8; }
  .sub { font-size: 13px; fill: #B9A9DE; }
  .label { font-size: 13px; fill: #B9A9DE; }
  .code { font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; font-size: 12.5px; fill: #D8CAFF; }
  .box { fill: #22193F; stroke: #4B3B85; stroke-width: 1; }
  .selected { fill: #3A2178; stroke: #B58AFF; stroke-width: 1.5; }
  .chip { fill: #2A1B52; }
  .icon { fill: none; stroke: #B9A9DE; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  .edge { fill: none; stroke-width: 1.5; }
</style>
<defs>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="1.2" fill="#262039"/>
  </pattern>
  <marker id="green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0.5 L7.5 4 L0 7.5z" fill="#4CC38A"/></marker>
  <marker id="purple" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0.5 L7.5 4 L0 7.5z" fill="#B58AFF"/></marker>
  <marker id="orange" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0.5 L7.5 4 L0 7.5z" fill="#F08A4B"/></marker>
  <marker id="neutral" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0.5 L7.5 4 L0 7.5z" fill="#7262A6"/></marker>
  <!-- the logo's (site/icon.svg) -->
  <linearGradient id="logo-tile" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#4c1d95"/><stop offset="55%" stop-color="#1e0a3c"/><stop offset="100%" stop-color="#0a0616"/>
  </linearGradient>
  <radialGradient id="logo-wash" cx="38%" cy="34%" r="60%">
    <stop offset="0%" stop-color="#a855f7" stop-opacity="0.65"/><stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
  </radialGradient>
</defs>

<rect width="800" height="800" fill="#0E0A1C"/>
<rect width="800" height="800" fill="url(#grid)"/>

<!-- the brand, as the site's bar has it -->
<g transform="translate(24 40) scale(0.03824)">
  <rect width="680" height="680" rx="150" fill="url(#logo-tile)"/>
  <rect width="680" height="680" rx="150" fill="url(#logo-wash)"/>
  <circle cx="425" cy="193" r="90" fill="#22d3ee" opacity="0.16"/>
  <g stroke="#e9d5ff" stroke-width="9" stroke-linecap="round" opacity="0.9">
    <line x1="340" y1="340" x2="425" y2="193"/><line x1="340" y1="340" x2="425" y2="487"/><line x1="340" y1="340" x2="170" y2="340"/>
  </g>
  <circle cx="425" cy="193" r="30" fill="#c084fc"/><circle cx="425" cy="487" r="30" fill="#c084fc"/><circle cx="170" cy="340" r="26" fill="#c084fc"/>
  <circle cx="340" cy="340" r="95" fill="#67e8f9" opacity="0.3"/>
  <circle cx="340" cy="340" r="62" fill="#f0fdff"/>
  <circle cx="340" cy="340" r="62" fill="none" stroke="#a855f7" stroke-width="6"/>
</g>
<text x="60" y="59" style="font-size:17px;font-weight:500;fill:#F1EEF8">Nebulosity</text>
<text class="label" x="60" y="82" style="font-size:14px">how the pieces fit together</text>

<!-- your machine: everything but the summaries' API -->
<rect x="16" y="128" width="768" height="616" rx="6" fill="#140E28" fill-opacity="0.45" stroke="#4B3B85" stroke-dasharray="6 5"/>
<text class="label" x="34" y="156">your machine</text>

<!-- the edges, under the boxes -->
<path class="edge" d="M400 232 V329" stroke="#4CC38A" marker-end="url(#green)"/>
<path class="edge" d="M540 352 H648 V109" stroke="#7262A6" stroke-dasharray="5 4" marker-start="url(#neutral)" marker-end="url(#neutral)"/>
<path class="edge" d="M400 414 V452 H180 V489" stroke="#B58AFF" marker-end="url(#purple)"/>
<path class="edge" d="M400 452 H620 V489" stroke="#B58AFF" marker-end="url(#purple)"/>
<path class="edge" d="M300 532 H499" stroke="#F08A4B" marker-end="url(#orange)"/>
<path class="edge" d="M166 644 V575" stroke="#F08A4B" marker-end="url(#orange)"/>
<path class="edge" d="M194 574 V643" stroke="#F08A4B" marker-end="url(#orange)"/>
<path class="edge" d="M620 574 V643" stroke="#7262A6" marker-end="url(#neutral)"/>

<!-- the edges' words -->
<rect class="chip" x="239" y="258" width="147" height="20"/>
<text class="code" x="245" y="272.5">nebulosity index .</text>
<text class="label" x="386" y="298" text-anchor="end">then on every save, while the Map is open</text>

<rect class="chip" x="459" y="258" width="177" height="20"/>
<text class="code" x="465" y="272.5">nebulosity summarize .</text>
<text class="label" x="636" y="298" text-anchor="end">optional, with your API key</text>

<text class="label" x="170" y="476" text-anchor="end">reads</text>
<text class="label" x="630" y="476">reads</text>
<text class="label" x="400" y="521" text-anchor="middle">shows you what</text>
<text class="label" x="400" y="553" text-anchor="middle">Claude Code is looking at</text>
<text class="label" x="154" y="614" text-anchor="end">asks</text>
<text class="label" x="206" y="614">answers, often in one call</text>

<!-- Anthropic API, outside your machine -->
<rect class="box" x="528" y="24" width="240" height="84" rx="4"/>
<path class="icon" transform="translate(544 42)" d="M4.5 12.5 H11.5 A3 3 0 0 0 12 6.54 A4 4 0 0 0 4.3 7.1 A2.75 2.75 0 0 0 4.5 12.5z"/>
<text class="name" x="570" y="54">Anthropic API</text>
<text class="sub" x="570" y="76">writes the AI summaries,</text>
<text class="sub" x="570" y="94">only if you add a key</text>

<!-- your repo -->
<rect class="box" x="290" y="160" width="220" height="72" rx="4"/>
<path class="icon" transform="translate(306 176)" style="stroke:#A98BEA" d="M1.5 4.5 A1 1 0 0 1 2.5 3.5 H6 L7.5 5 H13.5 A1 1 0 0 1 14.5 6 V12.5 A1 1 0 0 1 13.5 13.5 H2.5 A1 1 0 0 1 1.5 12.5z"/>
<text class="name" x="332" y="189">your repo</text>
<text class="sub" x="332" y="211">the code you're working on</text>

<!-- the index: the selected box -->
<rect class="selected" x="260" y="330" width="280" height="84" rx="4"/>
<g class="icon" transform="translate(276 348)" style="stroke:#D8CAFF">
  <ellipse cx="8" cy="3.5" rx="5.5" ry="2"/>
  <path d="M2.5 3.5 V12.5 A5.5 2 0 0 0 13.5 12.5 V3.5"/>
  <path d="M2.5 8 A5.5 2 0 0 0 13.5 8"/>
</g>
<text class="name" x="302" y="360">the index</text>
<text class="sub" x="302" y="382" style="fill:#D3C7EE">every file, import and folder,</text>
<text class="sub" x="302" y="400" style="fill:#D3C7EE">in SQLite on your machine</text>

<!-- MCP server -->
<rect class="box" x="60" y="490" width="240" height="84" rx="4"/>
<g class="icon" transform="translate(76 508)">
  <rect x="1.5" y="2" width="13" height="5" rx="1"/>
